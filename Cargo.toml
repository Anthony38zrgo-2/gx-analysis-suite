[workspace]
resolver = "2"
members = [
    "crates/gx_core",
    "crates/gx_sources",
    "crates/gx_rules",
    "crates/gx_engine",
    "crates/gx_storage",
    "crates/gx_report",
    "crates/gx_app",
    "crates/xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
# E01: MSRV REAL = máximo `rust-version` del grafo de dependencias
# (aes 0.9 declara 1.89). CI lo verifica con `cargo +1.89.0 check --locked`.
rust-version = "1.89"
authors = ["GX Linter Team"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
globset = "0.4"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
