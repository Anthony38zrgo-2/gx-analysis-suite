[workspace]
resolver = "2"
members = [
    "crates/gx_core",
    "crates/gx_rules",
    "crates/gx_engine",
    "crates/gx_storage",
    "crates/gx_report",
    "crates/gx_app",
    "crates/xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["GX Linter Team"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
