name: ci
on:
  push:
    # E01: la rama de entrega del repositorio es `master`.
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace
      # B04/E01: el engine sin `archives` no enlaza SQLite/Tauri/PDF/zip/unrar.
      - run: cargo run --locked -p xtask -- check-boundaries

  # GX-014/GATE-CLI: matriz de aceptación del CLI sobre un checkout limpio
  # (sin Python ni repositorio hermano).
  cli-matrix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p gx_app --test cli_matrix --release

  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --workspace --release

  # E01: MSRV real del grafo de dependencias (engine 1.89, desktop 1.90),
  # verificado contra los Cargo.lock versionados.
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check --workspace --all-targets --locked
      # El contexto Tauri embebe `desktop/dist`: hay que generarlo antes del
      # check con el toolchain mínimo.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo +1.90.0 check --manifest-path desktop/src-tauri/Cargo.toml --locked

  # A02/E01: gate determinista de operation-counts. No usa timings del runner
  # compartido: valida líneas/objetos/parsers/factories/findings por corrida.
  bench-gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # §5: gates deterministas (operation-counts) + escalado ~2x + envelope
      # de 512 MiB del proceso de análisis. El timing no bloquea en shared.
      - run: cargo run --locked --release -p xtask -- bench --check --scenario small-files --files 5 --lines 200 --scaling --max-peak-mib 512
      - run: cargo run --locked --release -p xtask -- bench --check --scenario wide-xml --files 2 --lines 25 --scaling --max-peak-mib 512
      - run: cargo run --locked --release -p xtask -- bench --check --scenario clean --files 3 --lines 100 --scaling --max-peak-mib 512
      - run: cargo run --locked --release -p xtask -- bench --check --scenario diagnostic-heavy --files 3 --lines 120 --scaling --max-peak-mib 512
      - run: cargo run --locked --release -p xtask -- bench --check --scenario long-lines --files 3 --lines 60 --scaling --max-peak-mib 512
      - run: cargo run --locked --release -p xtask -- bench --check --scenario real --max-peak-mib 512

  # GX-015..GX-018: desktop Tauri 2 + Vue. No depende de los jobs del
  # engine/CLI y estos no dependen de Node.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      # E01: fmt/clippy del workspace desktop (tiene su propio Cargo.lock).
      - run: cargo fmt --all -- --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - run: npm run tauri build
        working-directory: desktop
      # E01: resolver el target directory EFECTIVO del workspace desktop
      # (el `.cargo/config.toml` del root fija target-dir) y verificar el
      # artefacto antes de publicarlo.
      - name: Verificar instalador NSIS
        id: installer
        shell: pwsh
        run: |
          $metadata = cargo metadata --manifest-path desktop/src-tauri/Cargo.toml --format-version 1 --no-deps | ConvertFrom-Json
          $target = $metadata.target_directory
          $installers = @(Get-ChildItem -Path (Join-Path $target 'release/bundle/nsis/*.exe') -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            throw "No se encontró el instalador NSIS bajo '$target/release/bundle/nsis'"
          }
          $installer = $installers[0]
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "NSIS: $($installer.FullName) ($($installer.Length) bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: gx-linter-nsis
          path: ${{ steps.installer.outputs.installer }}
