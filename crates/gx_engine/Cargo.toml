[package]
name = "gx_engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["archives"]
# B04: sin `archives`, el engine compila y corre sin zip/unrar (sólo
# texto/XML); el soporte nativo queda como adapter opcional.
archives = ["gx_sources/archives"]

[dependencies]
gx_core = { path = "../gx_core" }
gx_sources = { path = "../gx_sources", default-features = false }
gx_rules = { path = "../gx_rules" }
anyhow = { workspace = true }
tracing = { workspace = true }
rayon = "1.8"

[dev-dependencies]
gx_storage = { path = "../gx_storage" }
serde_json = { workspace = true }
sha2 = "0.10"
